<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="toSQL AI — Natural Language to SQL Engine with schema introspection, AST guardrails, and real-time data visualizer." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>toSQL AI — Enterprise Text-to-SQL Command Center</title>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; height: 100vh; width: 100vw; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; gap: 16px;">
        <div style="width: 32px; height: 32px; border: 2px solid #e5e7eb; border-top-color: #17171c; border-radius: 50%; animation: spin 0.7s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
        <div style="font-size: 13px; font-weight: 500; color: #212121; letter-spacing: -0.01em;">Initializing toSQL Command Center...</div>
      </div>
      <style>
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
