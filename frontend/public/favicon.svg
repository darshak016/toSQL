<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Rounded Base Badge in Cohere Near-Black -->
  <rect width="32" height="32" rx="7" fill="#17171C" />
  
  <!-- Subtle Gradient Accent Line on Top -->
  <rect x="5" y="4" width="22" height="2" rx="1" fill="#FF7759" />

  <!-- Monospaced 'to_' text in crisp white -->
  <text 
    x="5" 
    y="22" 
    fill="#FFFFFF" 
    font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'JetBrains Mono', 'Segoe UI', sans-serif" 
    font-size="14" 
    font-weight="700" 
    letter-spacing="-0.06em"
  >to_</text>
</svg>